## IDF Component Manager Manifest File
##
## We deliberately do NOT declare lvgl here. The Waveshare BSP depends on
## lvgl/lvgl + esp_lvgl_port transitively, so those components are still
## downloaded and compiled — but none of OUR code includes lvgl.h or calls any
## lv_* function. The renderer is a pure software RGB565 pipeline.
dependencies:
  waveshare/esp32_s3_touch_amoled_1_75:
    version: '*'
  andresragot/glm:
    version: ^1.0.3
  # mDNS so the device is reachable at http://magic8ball.local/message.
  espressif/mdns:
    version: ^1.2.0
  # Wake-word detection (microWakeWord, ESPHome-derived standalone port). Pulls
  # esp-tflite-micro + ESPMicroSpeechFeatures transitively. GPLv3 — fine for this
  # one-off personal device. Used ONLY by hal/wakeword.cpp; never in host tests.
  #
  # Pinned to our fork: upstream hardcodes esp32/rom/crc.h, which doesn't exist on
  # esp32s3 (it lives at esp32s3/rom/crc.h). The fork's one-line fix uses the
  # chip-agnostic esp_rom_crc.h so a clean fetch builds. See the fork's HEAD.
  micro_wake_word:
    git: https://github.com/nathanstitt/micro_wake_word_standalone.git
    version: 1600f14f4e8face6681ced745da9377727bf2296
  kevincoooool/pmic_axp2101: '*'
